---
- name: Create OpenSpace VMs with static IPs via cloud-init (and kernel args for OSDC)
  hosts: mgmt-kvm
  become: yes
  vars:
    libvirt_cfg: /var/lib/libvirt/config
    basekit_root: /opt/openspace/openspace-base-kit/1.0.1

  tasks:
    - name: Extract base-kit archive
      ansible.builtin.unarchive:
        src: "/data/images/{{ basekit }}"
        dest: "/var/lib/libvirt/config"
        extra_opts:
          - "--no-overwrite-dir"

    # ---------- virt-install: MCM ----------
    - name: Create VM: MCM
      ansible.builtin.shell: |
        set -euo pipefail
        if ! virsh dominfo mcm >/dev/null 2>&1; then
          virt-install \
            --name mcm \
            --ram 16384 \
            --vcpu 8 \
            --cpu host-passthrough \
            --disk size=500,backing_store="/var/lib/libvirt/config/images/9_5_hardened_image_vm.qcow2" \
            --os-variant=rhel9.5 \
            --network bridge=br-mgmt,model=virtio \
            --network bridge=br-prov,model=virtio \
            --noautoconsole \
            --import \
            --autostart \
            --graphics vnc \
            --boot uefi
        fi
      args:
        executable: /bin/bash

    # ---------- virt-install: OSMS ----------
    - name: Create VM: OSMS
      ansible.builtin.shell: |
        set -euo pipefail
        if ! virsh dominfo osms >/dev/null 2>&1; then
          virt-install \
            --name osms \
            --ram 32768 \
            --vcpu 16 \
            --cpu host-passthrough \
            --disk size=600,backing_store="/var/lib/libvirt/config/images/9_5_hardened_image_vm.qcow2" \
            --os-variant=rhel9.5 \
            --network bridge=br-mgmt,model=virtio \
            --noautoconsole \
            --import \
            --autostart \
            --graphics vnc \
            --boot uefi
        fi
      args:
        executable: /bin/bash

    # ---------- virt-install: OSDC provisioner (kernel IP args) ----------
    - name: Compute netmask from prefixlen for OSDC
      ansible.builtin.set_fact:
        _osdc_netmask: "{{ (vms.osdc_provisioner.prefixlen | int) | ipaddr('netmask') }}"

    - name: Create VM: OSDC provisioner (Kickstart + static IP via kernel args)
      ansible.builtin.shell: |
        set -euo pipefail
        if ! virsh dominfo osdc-provisioner >/dev/null 2>&1; then
          virt-install \
            --name osdc-provisioner \
            --ram 6144 \
            --vcpu 4 \
            --cpu host-passthrough \
            --disk size=100 \
            --location /var/lib/libvirt/config/images/Rocky-9.4-x86_64-dvd.iso,initrd=isolinux/initrd.img,kernel=isolinux/vmlinuz \
            --initrd-inject /var/lib/libvirt/config/vm_config/osdc/prov_vm_ks.cfg \
            --extra-args="inst.ks=file:/prov_vm_ks.cfg console=tty0" \
            --os-variant=rocky9 \
            --network bridge=br-iDRAC,model=virtio \
            --noautoconsole \
            --noautostart
        fi
      args:
        executable: /bin/bash
